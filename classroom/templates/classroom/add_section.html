{% extends 'dashboard/base.html' %}
{% load static %}
{% block title %}Add Section - {{ course.name }}{% endblock %}
{% block extra_css %}
<style>
        #content{font-family: Arial, sans-serif;}
        label { font-weight: bold; }
        input { width: 100%; padding: 8px; margin-top: 5px; }
        button {
            margin-top: 15px;
            padding: 10px 15px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background:#1e40af; }
    </style>
{% endblock %}
{% block content %}

<h1>Add Section to {{ course.name }}</h1>


<form method="POST">
    {% csrf_token %}
    
    <label>Section Title</label>
    <input type="text" name="title" required>

    <button type="submit">Add Section</button>
</form>
{% endblock %}
