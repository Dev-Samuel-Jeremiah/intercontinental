{% load static %}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}{{ tenant.name|default:'School Portal' }}{% endblock %}</title>
<link rel="icon" href="{% static 'images/logo.png' %}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
  :root{--ink:#0f2449;--soft:#5b6170;--line:#e4e2dc;--gold:#0a1f44;--gold-lt:#ffe066;--bg:#faf8f4;--card:#fff;--red:#b42318;--green:#067647}
  *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55}
  a{color:var(--gold)}.top{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);background:#fff}
  .top b{font-size:1.1rem;letter-spacing:.3px}.top nav a{margin-left:16px;text-decoration:none;color:var(--ink);font-size:.92rem}
  .wrap{max-width:980px;margin:0 auto;padding:28px 16px 60px}h1{font-size:2rem;margin:.2rem 0 .4rem;line-height:1.2}.sub{color:var(--soft);margin:0 0 1.4rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
  label{display:block;font-size:.82rem;font-weight:600;margin:.7rem 0 .25rem}input,select,textarea{width:100%;padding:.6rem .7rem;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:640px){.row{grid-template-columns:1fr}h1{font-size:1.6rem}}
  .btn{display:inline-block;background:var(--ink);color:#fff;border:0;border-radius:12px;padding:.75rem 1.2rem;font-weight:700;font-size:1rem;cursor:pointer;text-decoration:none}
  .btn.gold{background:var(--gold);color:#0a1f44}.err{background:#fef3f2;border:1px solid #fecdca;color:var(--red);border-radius:12px;padding:.7rem 1rem;margin-bottom:1rem}
  .hint{color:var(--soft);font-size:.85rem}.ok{color:var(--green)}.bad{color:var(--red)}
  .art h3{margin:1.4rem 0 .4rem}.art p,.art li{font-size:1rem}
</style>{% block head %}{% endblock %}</head>
<body><div class="top"><b><a href="/" style="color:var(--ink);text-decoration:none">{{ tenant.name|default:"School Portal" }}</a></b><nav><a href="/">Sign in</a></nav></div>
<div class="wrap">{% block content %}{% endblock %}</div></body></html>
