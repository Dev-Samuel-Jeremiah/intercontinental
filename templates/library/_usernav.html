{% include "finance/_fin_styles.html" %}
<style>.pill{display:inline-flex;gap:.3rem;align-items:center;margin:0 .5rem .3rem 0;font-size:.85rem}.pill input{width:auto}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:.8rem}
a.bk{display:block;padding:.8rem;border:1px solid var(--rim);border-radius:14px;color:inherit;text-decoration:none;background:rgba(255,255,255,.03)}
a.bk:hover{border-color:var(--champagne,#f4d21f)}a.bk img{width:100%;height:150px;object-fit:cover;border-radius:8px;margin-bottom:.4rem;background:rgba(255,255,255,.05)}
a.bk b{display:block;font-size:.9rem}a.bk small{color:var(--slate2)}
.bar{height:9px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#f4d21f,#ffe066)}</style>
<div class="no-print" style="display:flex;gap:.4rem;flex-wrap:wrap;margin:-.6rem 0 1.2rem">
  <a class="fin-btn fin-btn-sm" href="{% url 'library:search' %}"><i class="bi bi-search"></i> Find a book</a>
  <a class="fin-btn fin-btn-sm" href="{% url 'library:mine' %}"><i class="bi bi-person"></i> My library</a>
  <a class="fin-btn fin-btn-sm" href="{% url 'library:eresources' %}"><i class="bi bi-file-earmark-pdf"></i> E-library &amp; past questions</a>
</div>
