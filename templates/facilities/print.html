<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }}</title>
<style>body{font-family:Arial,Helvetica,sans-serif;max-width:760px;margin:30px auto;padding:0 20px;color:#111;background:#fff;line-height:1.5}
.top{display:flex;justify-content:space-between;border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:20px}.top h1{margin:0;font-size:20px}
table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:6px}.bar{margin-bottom:16px}@media print{.bar{display:none}}</style></head>
<body><div class="bar"><button onclick="window.print()">Print</button></div>
<div class="top"><h1>{{ school }}</h1><div><b>{{ title }}</b><br>{% now "j F Y" %}</div></div>
{{ html|safe }}
</body></html>
