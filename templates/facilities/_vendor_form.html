<div><label>Name</label><input name="name" required maxlength="160" value="{{ v.name|default:'' }}"></div>
<div class="row2"><div><label>Contact person</label><input name="contact_person" maxlength="120" value="{{ v.contact_person|default:'' }}"></div><div><label>Phone</label><input name="phone" maxlength="20" value="{{ v.phone|default:'' }}"></div></div>
<div class="row2"><div><label>Email</label><input type="email" name="email" value="{{ v.email|default:'' }}"></div><div><label>Supplies</label><input name="supplies" maxlength="160" value="{{ v.supplies|default:'' }}" placeholder="Stationery, diesel…"></div></div>
<div><label>Address</label><input name="address" maxlength="255" value="{{ v.address|default:'' }}"></div>
<div class="row2"><div><label>TIN</label><input name="tax_id" maxlength="40" value="{{ v.tax_id|default:'' }}"></div><div><label>Bank</label><input name="bank_name" maxlength="80" value="{{ v.bank_name|default:'' }}"></div></div>
<div class="row2"><div><label>Account name</label><input name="account_name" maxlength="120" value="{{ v.account_name|default:'' }}"></div><div><label>Account number</label><input name="account_number" maxlength="20" value="{{ v.account_number|default:'' }}"></div></div>
<div><label>Notes</label><textarea name="notes" rows="2">{{ v.notes|default:'' }}</textarea></div>
