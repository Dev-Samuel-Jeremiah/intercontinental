{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#081a3a">
  <title>{% block title %}Notice{% endblock %}{% if tenant %} | {{ tenant.name }}{% endif %}</title>
  <link rel="icon" href="{% if tenant.logo %}{{ tenant.logo.url }}{% else %}{% static 'images/logo.png' %}{% endif %}" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root { --ink:#081a3a; --rim:rgba(255,255,255,.06); --rim2:rgba(255,255,255,.10); --gold:#f4d21f; --gold-lt:#ffe580; --gold-dk:#c9a800; --gold-rim:rgba(244,210,31,.30);
            --text:#f2f5fb; --text-2:rgba(242,245,251,.64); --text-3:rgba(242,245,251,.42); --tone:#f4d21f; --tone-rgb:244,210,31;
            --serif:"Cormorant Garamond", Georgia, serif; --sans:"Outfit", system-ui, sans-serif; --ease:cubic-bezier(.22,1,.36,1); }
    .tone-green { --tone:#5ecb8e; --tone-rgb:94,203,142; }
    .tone-red   { --tone:#e87070; --tone-rgb:232,112,112; }
    .tone-amber { --tone:#f59e0b; --tone-rgb:245,158,11; }
    .tone-blue  { --tone:#60a8e8; --tone-rgb:96,168,232; }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body {
      min-height:100vh; min-height:100svh; display:grid; place-items:center; padding:24px 16px;
      font-family:var(--sans); color:var(--text); -webkit-font-smoothing:antialiased;
      background:
        radial-gradient(700px 480px at 50% -10%, rgba(var(--tone-rgb),.16), transparent 65%),
        radial-gradient(600px 500px at 100% 110%, rgba(30,80,190,.10), transparent 60%),
        var(--ink);
    }
    body::before {
      content:""; position:fixed; inset:0; pointer-events:none;
      background-image:linear-gradient(to right, rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size:56px 56px; mask-image:radial-gradient(ellipse 60% 55% at 50% 40%, #000 20%, transparent 75%); -webkit-mask-image:radial-gradient(ellipse 60% 55% at 50% 40%, #000 20%, transparent 75%);
    }
    a { color:inherit; text-decoration:none; }
    :focus-visible { outline:2px solid var(--gold-lt); outline-offset:3px; }
    .wrap { position:relative; width:min(520px,100%); text-align:center; animation:rise .8s var(--ease) both; }
    @keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
    .school { display:inline-flex; align-items:center; gap:.65rem; margin-bottom:2.2rem; padding:.4rem .9rem .4rem .4rem; border-radius:99px; background:rgba(255,255,255,.035); border:1px solid var(--rim2); font-size:.84rem; font-weight:600; }
    .school-logo { width:30px; height:30px; border-radius:50%; overflow:hidden; display:grid; place-items:center; background:linear-gradient(135deg,var(--gold-lt),var(--gold-dk)); color:#0a1f44; font-family:var(--serif); font-weight:700; font-size:.85rem; }
    .school-logo img { width:100%; height:100%; object-fit:cover; }
    .icon { position:relative; width:84px; height:84px; margin:0 auto 1.8rem; border-radius:26px; display:grid; place-items:center; font-size:2.1rem; color:var(--tone);
            background:linear-gradient(135deg, rgba(var(--tone-rgb),.24), rgba(var(--tone-rgb),.04)); border:1px solid rgba(var(--tone-rgb),.38); box-shadow:0 22px 50px -20px rgba(var(--tone-rgb),.6); }
    .icon::after { content:""; position:absolute; inset:-10px; border-radius:32px; border:1px solid rgba(var(--tone-rgb),.18); animation:pulse 2.6s var(--ease) infinite; }
    @keyframes pulse { 0% { transform:scale(.92); opacity:1; } 100% { transform:scale(1.18); opacity:0; } }
    .eyebrow { display:inline-flex; align-items:center; gap:.6rem; font-size:.68rem; font-weight:700; letter-spacing:1.8px; text-transform:uppercase; color:var(--tone); margin-bottom:.75rem; }
    .eyebrow::before, .eyebrow::after { content:""; width:22px; height:1px; background:rgba(var(--tone-rgb),.4); }
    h1 { font-family:var(--serif); font-weight:600; font-size:clamp(2.1rem,6vw,2.8rem); line-height:1.08; letter-spacing:-.01em; margin-bottom:1rem; }
    h1 em { font-style:italic; color:var(--gold-lt); }
    p { color:var(--text-2); font-weight:300; line-height:1.7; font-size:1rem; }
    p strong { color:var(--text); font-weight:600; }
    .detail { margin:1.6rem auto 0; display:grid; gap:.6rem; text-align:left; max-width:420px; }
    .detail div { display:flex; align-items:center; gap:.75rem; padding:.75rem 1rem; border-radius:12px; background:rgba(255,255,255,.03); border:1px solid var(--rim); font-size:.87rem; color:var(--text-2); }
    .detail i { color:var(--gold-lt); font-size:1rem; }
    .actions { display:flex; flex-wrap:wrap; justify-content:center; gap:.7rem; margin-top:2rem; }
    .btn { display:inline-flex; align-items:center; gap:.5rem; padding:.85rem 1.4rem; border-radius:12px; font-weight:600; font-size:.92rem; border:1px solid var(--rim2); background:rgba(255,255,255,.04); color:var(--text); transition:transform .25s var(--ease), box-shadow .25s, border-color .2s, color .2s; }
    .btn:hover { border-color:var(--gold-rim); color:var(--gold-lt); transform:translateY(-1px); }
    .btn-gold { border-color:transparent; color:#0a1f44; background:linear-gradient(135deg,var(--gold-lt),var(--gold) 60%,var(--gold-dk)); box-shadow:0 14px 30px -12px rgba(244,210,31,.7), inset 0 1px 0 rgba(255,255,255,.45); }
    .btn-gold:hover { color:#0a1f44; box-shadow:0 18px 36px -12px rgba(244,210,31,.85); }
    .help { margin-top:2rem; font-size:.84rem; color:var(--text-3); }
    .help a { color:var(--gold-lt); border-bottom:1px solid var(--gold-rim); }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; } }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body class="{% block tone %}{% endblock %}">
  <main class="wrap">
    {% if tenant %}
    <div class="school">
      <span class="school-logo">{% if tenant.logo %}<img src="{{ tenant.logo.url }}" alt="">{% else %}{{ tenant.name|slice:":2"|upper }}{% endif %}</span>
      {{ tenant.name }}
    </div>
    {% endif %}
    {% block body %}{% endblock %}
  </main>
</body>
</html>
