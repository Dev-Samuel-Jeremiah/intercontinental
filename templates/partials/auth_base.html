{% load static school_look %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#081a3a">
  <title>{% block title %}Account{% endblock %}{% if tenant %} | {{ tenant.name }}{% endif %}</title>
  <link rel="icon" href="{% school_crest %}" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --ink:#081a3a; --surface:#0f244b; --surface2:#132a54;
      --rim:rgba(255,255,255,.06); --rim2:rgba(255,255,255,.10); --rim3:rgba(255,255,255,.16);
      --gold:#f4d21f; --gold-lt:#ffe580; --gold-dk:#c9a800; --gold-dim:rgba(244,210,31,.12); --gold-rim:rgba(244,210,31,.30);
      --text:#f2f5fb; --text-2:rgba(242,245,251,.64); --text-3:rgba(242,245,251,.42);
      --green:#5ecb8e; --red:#e87070; --amber:#f59e0b; --blue:#60a8e8;
      --serif:"Cormorant Garamond", Georgia, serif; --sans:"Outfit", system-ui, sans-serif;
      --ease:cubic-bezier(.22,1,.36,1);
    }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    html, body { min-height:100%; }
    body { font-family:var(--sans); background:var(--ink); color:var(--text); -webkit-font-smoothing:antialiased; }
    a { color:inherit; text-decoration:none; }
    :focus-visible { outline:2px solid var(--gold-lt); outline-offset:3px; }

    .auth { min-height:100vh; min-height:100svh; display:grid; grid-template-columns:1.05fr 1fr; }

    /* Brand panel */
    .brand-panel {
      position:relative; overflow:hidden; isolation:isolate;
      display:flex; flex-direction:column; justify-content:space-between; gap:2rem;
      padding:clamp(2rem,5vw,3.5rem);
      background:
        radial-gradient(700px 500px at 0% 0%, rgba(244,210,31,.20), transparent 60%),
        radial-gradient(600px 500px at 100% 100%, rgba(30,80,190,.12), transparent 60%),
        linear-gradient(160deg, #0e2347, #0a1c3d);
      border-right:1px solid var(--rim);
    }
    .brand-panel::before {
      content:""; position:absolute; inset:0; z-index:-1;
      background-image:linear-gradient(to right, rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size:56px 56px;
      mask-image:radial-gradient(ellipse 80% 70% at 30% 40%, #000 20%, transparent 75%);
      -webkit-mask-image:radial-gradient(ellipse 80% 70% at 30% 40%, #000 20%, transparent 75%);
    }
    .orb { position:absolute; z-index:-1; border-radius:50%; border:1px solid rgba(244,210,31,.16); }
    .orb.o1 { width:520px; height:520px; right:-220px; top:18%; animation:spin 80s linear infinite; border-style:dashed; }
    .orb.o2 { width:360px; height:360px; right:-140px; top:28%; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .bp-brand { display:flex; align-items:center; gap:.8rem; }
    .bp-logo { width:46px; height:46px; border-radius:13px; overflow:hidden; display:grid; place-items:center; background:linear-gradient(135deg, rgba(255,229,128,.22), rgba(244,210,31,.06)); border:1px solid var(--gold-rim); font-family:var(--serif); font-weight:700; color:var(--gold-lt); }
    .bp-logo img { width:100%; height:100%; object-fit:cover; }
    .bp-name { font-weight:700; font-size:1rem; }
    .bp-sub { font-size:.66rem; font-weight:600; letter-spacing:1.6px; text-transform:uppercase; color:var(--gold); }
    .bp-copy h2 { font-family:var(--serif); font-weight:600; font-size:clamp(2.2rem,4vw,3.4rem); line-height:1.05; letter-spacing:-.01em; margin-bottom:1rem; }
    .bp-copy h2 em { font-style:italic; background:linear-gradient(100deg, var(--gold-dk), var(--gold-lt) 40%, #fff5dc 50%, var(--gold-lt) 60%, var(--gold)); background-size:250% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:shimmer 6s linear infinite; }
    @keyframes shimmer { to { background-position:-250% 0; } }
    .bp-copy p { color:var(--text-2); font-weight:300; max-width:420px; line-height:1.65; }
    .bp-points { list-style:none; display:grid; gap:.75rem; }
    .bp-points li { display:flex; align-items:center; gap:.75rem; font-size:.88rem; color:var(--text-2); }
    .bp-points i { width:32px; height:32px; border-radius:10px; display:grid; place-items:center; background:var(--gold-dim); border:1px solid var(--gold-rim); color:var(--gold-lt); flex-shrink:0; }
    .bp-foot { font-size:.76rem; color:var(--text-3); }

    /* Form side */
    .form-side { display:grid; place-items:center; padding:clamp(1.5rem,5vw,3rem) 16px; position:relative; }
    .card { width:min(430px, 100%); animation:rise .8s var(--ease) both; }
    @keyframes rise { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }
    .card-icon {
      width:58px; height:58px; border-radius:18px; margin-bottom:1.4rem; display:grid; place-items:center; font-size:1.45rem;
      background:linear-gradient(135deg, rgba(255,229,128,.22), rgba(244,210,31,.05)); border:1px solid var(--gold-rim); color:var(--gold-lt);
      box-shadow:0 14px 34px -14px rgba(244,210,31,.55);
    }
    .card-icon.ok { background:linear-gradient(135deg, rgba(94,203,142,.25), rgba(94,203,142,.05)); border-color:rgba(94,203,142,.35); color:var(--green); box-shadow:0 14px 34px -14px rgba(94,203,142,.5); }
    .card-icon.bad { background:linear-gradient(135deg, rgba(232,112,112,.25), rgba(232,112,112,.05)); border-color:rgba(232,112,112,.35); color:var(--red); box-shadow:none; }
    .eyebrow { display:inline-flex; align-items:center; gap:.55rem; font-size:.68rem; font-weight:700; letter-spacing:1.8px; text-transform:uppercase; color:var(--gold); margin-bottom:.6rem; }
    .eyebrow::before { content:""; width:22px; height:1px; background:var(--gold-rim); }
    .card h1 { font-family:var(--serif); font-weight:600; font-size:2.3rem; line-height:1.1; letter-spacing:-.01em; margin-bottom:.6rem; }
    .card h1 em { font-style:italic; color:var(--gold-lt); }
    .lead { color:var(--text-2); font-size:.93rem; font-weight:300; line-height:1.6; margin-bottom:1.8rem; }
    .lead strong { color:var(--text); font-weight:600; }

    .field { margin-bottom:1.1rem; }
    .field label { display:block; font-size:.76rem; font-weight:600; letter-spacing:.3px; color:var(--text-2); margin-bottom:.45rem; }
    .input { position:relative; }
    .input > i.lead-icon { position:absolute; left:.95rem; top:50%; transform:translateY(-50%); color:var(--text-3); font-size:.95rem; pointer-events:none; transition:color .2s; }
    .input input {
      width:100%; padding:.85rem 2.8rem .85rem 2.6rem; border-radius:12px; font:inherit; font-size:.92rem;
      background:rgba(255,255,255,.035); border:1px solid var(--rim2); color:var(--text); outline:none;
      transition:border-color .2s, box-shadow .2s, background .2s;
    }
    .input input::placeholder { color:var(--text-3); }
    .input input:focus { border-color:var(--gold); background:rgba(244,210,31,.05); box-shadow:0 0 0 4px rgba(244,210,31,.12); }
    .input:focus-within > i.lead-icon { color:var(--gold-lt); }
    .eye { position:absolute; right:.55rem; top:50%; transform:translateY(-50%); width:34px; height:34px; border-radius:9px; border:0; background:none; color:var(--text-3); cursor:pointer; display:grid; place-items:center; }
    .eye:hover { color:var(--gold-lt); background:rgba(255,255,255,.05); }
    .hint { font-size:.74rem; color:var(--text-3); margin-top:.4rem; }

    .meter { display:flex; gap:4px; margin-top:.55rem; }
    .meter i { flex:1; height:4px; border-radius:99px; background:rgba(255,255,255,.08); transition:background .3s; }
    .meter-label { font-size:.72rem; color:var(--text-3); margin-top:.35rem; min-height:1em; }
    .match { font-size:.74rem; margin-top:.4rem; min-height:1em; }

    .btn {
      position:relative; overflow:hidden; width:100%; display:inline-flex; align-items:center; justify-content:center; gap:.55rem;
      padding:.95rem 1.2rem; border-radius:12px; border:0; cursor:pointer; font:inherit; font-size:.93rem; font-weight:600;
      background:linear-gradient(135deg, var(--gold-lt), var(--gold) 60%, var(--gold-dk)); color:#0a1f44;
      box-shadow:0 14px 30px -12px rgba(244,210,31,.7), inset 0 1px 0 rgba(255,255,255,.45);
      transition:transform .25s var(--ease), box-shadow .25s;
    }
    .btn::after { content:""; position:absolute; inset:0; background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,.5) 50%, transparent 70%); transform:translateX(-120%); transition:transform .9s var(--ease); }
    .btn:hover { transform:translateY(-1px); box-shadow:0 18px 36px -12px rgba(244,210,31,.85); }
    .btn:hover::after { transform:translateX(120%); }
    .btn.ghost { background:rgba(255,255,255,.04); color:var(--text); border:1px solid var(--rim2); box-shadow:none; }
    .btn.ghost:hover { border-color:var(--gold-rim); color:var(--gold-lt); }
    .btn.loading { pointer-events:none; opacity:.85; }
    .btn.loading .btn-label::after { content:"…"; }

    .note { display:flex; gap:.7rem; padding:.9rem 1rem; border-radius:12px; font-size:.83rem; line-height:1.55; margin-bottom:1.3rem; color:var(--text-2); background:rgba(255,255,255,.03); border:1px solid var(--rim); }
    .note i { color:var(--gold-lt); font-size:1rem; margin-top:.05rem; }
    .note.error { background:rgba(232,112,112,.1); border-color:rgba(232,112,112,.3); color:var(--red); }
    .note.error i { color:var(--red); }
    .note.success { background:rgba(94,203,142,.1); border-color:rgba(94,203,142,.3); color:var(--green); }
    .note.success i { color:var(--green); }
    .note ul { margin:.35rem 0 0 1rem; }
    .note ul li { margin:.15rem 0; }
    .note .errorlist { list-style:none; margin:0; }

    .steps { list-style:none; counter-reset:s; display:grid; gap:.7rem; margin-bottom:1.8rem; }
    .steps li { counter-increment:s; display:flex; align-items:center; gap:.8rem; font-size:.88rem; color:var(--text-2); }
    .steps li::before { content:counter(s); width:28px; height:28px; border-radius:50%; flex-shrink:0; display:grid; place-items:center; font-size:.76rem; font-weight:700; background:var(--gold-dim); border:1px solid var(--gold-rim); color:var(--gold-lt); }

    .back { display:flex; justify-content:center; margin-top:1.4rem; }
    .back a { display:inline-flex; align-items:center; gap:.45rem; font-size:.85rem; color:var(--text-2); transition:color .2s, gap .2s; }
    .back a:hover { color:var(--gold-lt); gap:.65rem; }


    /* ── The portal's 3D look: one centred raised card over the school's own banner picture ── */
    :root{--edge:#06132c;--deep:#8a7300;--slab:linear-gradient(165deg,#1b3768 0%,#12295a 42%,#0d1f45 100%);
      --jelly:radial-gradient(120% 110% at 28% 18%,rgba(255,255,255,.62) 0,rgba(255,255,255,0) 40%),linear-gradient(150deg,var(--gold-lt),var(--gold) 55%,var(--gold-dk))}
    .scene{position:fixed;inset:0;z-index:-2;background:var(--scene) center/cover no-repeat}
    .scene::after{content:"";position:absolute;inset:0;background:radial-gradient(900px 600px at 50% 40%,rgba(8,26,58,.72),rgba(8,26,58,.94)),linear-gradient(0deg,var(--ink),transparent 40%)}
    body{background:var(--ink);display:flex;flex-direction:column;min-height:100vh}
    .bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px clamp(16px,4vw,40px)}
    .bar .brand{display:flex;align-items:center;gap:.7rem;min-width:0;font-weight:700;font-size:.95rem}
    .bar .brand span{width:40px;height:40px;border-radius:12px;overflow:hidden;background:#fff;padding:3px;flex-shrink:0;
      box-shadow:0 0 0 2px var(--gold),0 3px 0 2px var(--edge)}
    .bar .brand img{width:100%;height:100%;object-fit:contain}
    .bar a.home{display:inline-flex;align-items:center;gap:.45rem;padding:.7rem 1.05rem;border-radius:14px;font-weight:600;font-size:.9rem;
      background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.03)),#132b58;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 4px 0 var(--edge),0 12px 18px -10px rgba(0,0,0,.7);transition:transform .12s}
    .bar a.home:hover{transform:translateY(-2px)} .bar a.home:active{transform:translateY(3px)}
    .auth{flex:1;display:flex;align-items:center;justify-content:center;padding:16px 16px 40px;min-height:0}
    .form-side{display:block;padding:0;width:min(470px,100%)}
    .card{width:100%;border-radius:28px;background:var(--slab);padding:clamp(1.5rem,4vw,2.3rem);text-align:left;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 -1px 0 rgba(0,0,0,.35),0 7px 0 var(--edge),0 30px 60px -20px rgba(0,0,0,.85)}
    .crest{display:grid;place-items:center;width:84px;height:84px;margin:0 auto 1.2rem;border-radius:50%;padding:8px;
      background:radial-gradient(circle at 35% 25%,#fff 0,#f4f1e6 70%,#e6dfc8 100%);
      box-shadow:0 0 0 4px var(--gold),0 0 0 6px var(--deep),inset 0 -4px 8px rgba(0,0,0,.12),0 8px 0 4px var(--edge),0 22px 30px -10px rgba(0,0,0,.8)}
    .crest img{width:100%;height:100%;object-fit:contain;border-radius:50%}
    .card-icon{width:52px;height:52px;border-radius:16px;border:0;color:#0a1f44;background:var(--jelly);text-shadow:0 1px 0 rgba(255,255,255,.45);
      box-shadow:inset 0 2px 1px rgba(255,255,255,.55),inset 0 -4px 7px rgba(0,0,0,.22),0 4px 0 var(--deep),0 12px 18px -8px rgba(0,0,0,.7)}
    .card-icon.ok{--gold-lt:#a7f3d0;--gold:#34d399;--gold-dk:#059669;--deep:#065f46;color:#052e16}
    .card-icon.bad{--gold-lt:#fca5a5;--gold:#f87171;--gold-dk:#dc2626;--deep:#7f1d1d;color:#450a0a}
    .card h1{text-shadow:0 2px 0 rgba(0,0,0,.35)}
    /* the crest leads the card; a status tile (done / link expired) still shows, centred */
    .card-icon:not(.ok):not(.bad){display:none}
    .card-icon.ok,.card-icon.bad{margin:0 auto 1.2rem}
    .card > .eyebrow{display:flex;justify-content:center}
    .card > .eyebrow::before{display:none}
    .card > h1,.card > .lead{text-align:center}
    .input input{border:0;border-radius:14px;background:rgba(2,8,24,.5);box-shadow:inset 0 2px 5px rgba(0,0,0,.6),inset 0 -1px 0 rgba(255,255,255,.04),0 1px 0 rgba(255,255,255,.07)}
    .input input:focus{background:rgba(2,8,24,.6);box-shadow:inset 0 2px 5px rgba(0,0,0,.6),0 0 0 1px rgba(244,210,31,.45),0 0 16px -4px rgba(244,210,31,.35)}
    .meter i{background:rgba(2,8,24,.55);box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
    .btn{border-radius:14px;text-shadow:0 1px 0 rgba(255,255,255,.4);
      background:radial-gradient(120% 140% at 25% 0%,rgba(255,255,255,.55) 0,rgba(255,255,255,0) 45%),linear-gradient(160deg,var(--gold-lt),var(--gold));
      box-shadow:inset 0 2px 1px rgba(255,255,255,.55),inset 0 -3px 6px rgba(0,0,0,.18),0 4px 0 var(--deep),0 14px 22px -10px rgba(244,210,31,.6);transition:transform .12s ease,box-shadow .12s ease}
    .btn::after{display:none}
    .btn:hover{transform:translateY(-2px);box-shadow:inset 0 2px 1px rgba(255,255,255,.6),inset 0 -3px 6px rgba(0,0,0,.18),0 6px 0 var(--deep),0 18px 26px -10px rgba(244,210,31,.6)}
    .btn:active{transform:translateY(3px);box-shadow:inset 0 2px 1px rgba(255,255,255,.45),0 1px 0 var(--deep)}
    .btn.ghost{border:0;color:var(--text);text-shadow:none;background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.03)),#132b58;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 1px rgba(255,255,255,.06),0 4px 0 var(--edge),0 12px 18px -10px rgba(0,0,0,.7)}
    .note{border:0;border-radius:14px;background:rgba(2,8,24,.3);box-shadow:inset 0 1px 3px rgba(0,0,0,.45)}
    .note.error{background:rgba(232,112,112,.12);box-shadow:inset 0 0 0 1px rgba(232,112,112,.3)}
    .note.success{background:rgba(94,203,142,.1);box-shadow:inset 0 0 0 1px rgba(94,203,142,.3)}
    .steps li::before{border:0;color:#0a1f44;background:var(--jelly);box-shadow:inset 0 1px 1px rgba(255,255,255,.5),0 2px 0 var(--deep)}
    .legal{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px clamp(16px,4vw,40px) 22px;font-size:.8rem;color:var(--text-3)}
    .legal a:hover{color:var(--gold-lt)}
    @media (max-width:520px){ .bar a.home span{display:none} }
    @media (max-width:900px) {
      .auth { grid-template-columns:1fr; grid-template-rows:auto 1fr; }
      .brand-panel { padding:1.4rem 16px; border-right:0; border-bottom:1px solid var(--rim); }
      .bp-copy, .bp-points, .bp-foot, .orb { display:none; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body style="--scene:url('{% school_banner %}')">
<div class="scene" aria-hidden="true"></div>
<header class="bar">
  <a class="brand" href="{% url 'users:home' %}"><span><img src="{% school_crest %}" alt=""></span>{{ tenant.name|default:"School Portal" }}</a>
  <a class="home" href="{% url 'users:staff_login' %}"><i class="bi bi-arrow-left"></i><span>Back to sign-in</span></a>
</header>
<main class="auth">
  <section class="form-side">
    <div class="card">
      <span class="crest"><img src="{% school_crest %}" alt="{{ tenant.name }} crest"></span>
      {% block card %}{% endblock %}
    </div>
  </section>
</main>
<footer class="legal">
  <span>&copy; {% now "Y" %} {{ tenant.name }}</span>
  <a href="{% url 'privacy_notice' %}">Privacy notice</a>
</footer>

<script>
/* Password visibility toggles, strength meter, match check, submit state */
(function () {
  document.querySelectorAll('[data-eye]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var input = document.getElementById(btn.getAttribute('data-eye'));
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.innerHTML = '<i class="bi bi-eye' + (show ? '-slash' : '') + '"></i>';
      btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    });
  });
  var COLORS = ['#e87070', '#f59e0b', '#f4d21f', '#5ecb8e'], LABELS = ['Weak', 'Fair', 'Good', 'Strong'];
  document.querySelectorAll('[data-meter]').forEach(function (input) {
    var meter = document.getElementById(input.getAttribute('data-meter'));
    var bars = meter.querySelectorAll('i'), label = meter.nextElementSibling;
    input.addEventListener('input', function () {
      var v = input.value, score = 0;
      if (v.length >= 8) score++;
      if (/[A-Z]/.test(v) && /[a-z]/.test(v)) score++;
      if (/\d/.test(v)) score++;
      if (/[^A-Za-z0-9]/.test(v) || v.length >= 12) score++;
      bars.forEach(function (b, i) { b.style.background = v && i < score ? COLORS[Math.max(score - 1, 0)] : ''; });
      if (label) label.textContent = v ? LABELS[Math.max(score - 1, 0)] + ' password' : '';
    });
  });
  document.querySelectorAll('[data-match]').forEach(function (input) {
    var other = document.getElementById(input.getAttribute('data-match'));
    var out = document.getElementById(input.id + '_match');
    function check() {
      if (!input.value) { out.textContent = ''; return; }
      var ok = input.value === other.value;
      out.textContent = ok ? '✓ Passwords match' : 'Passwords do not match yet';
      out.style.color = ok ? '#5ecb8e' : 'rgba(242,245,251,.42)';
    }
    input.addEventListener('input', check); other.addEventListener('input', check);
  });
  document.querySelectorAll('form').forEach(function (f) {
    f.addEventListener('submit', function () { var b = f.querySelector('.btn[type=submit]'); if (b) b.classList.add('loading'); });
  });
})();
</script>
</body>
</html>
