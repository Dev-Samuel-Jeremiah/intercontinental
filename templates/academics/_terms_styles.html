<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
/* ═══════════════════════════════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════════════════════════════ */
/* design tokens come from dashboard/base.html */

/* ═══════════════════════════════════════════════════════════════
   KEYFRAMES
═══════════════════════════════════════════════════════════════ */
@keyframes riseUp {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ═══════════════════════════════════════════════════════════════
   BASE WRAP
═══════════════════════════════════════════════════════════════ */
.terms-wrap {
  max-width: 780px;
  padding: 2rem 2.5rem 4rem;
  margin: 0 auto;
  font-family: 'Outfit', sans-serif;
  color: var(--white);
  animation: riseUp .4s ease both;
}

/* ═══════════════════════════════════════════════════════════════
   PAGE HEADER
═══════════════════════════════════════════════════════════════ */
.page-header {
  text-align: center;
  margin-bottom: 2rem;
}
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.eyebrow::before {
  content: '';
  display: block;
  width: 28px; height: 1px;
  background: var(--champagne);
}
.eyebrow::after {
  content: '';
  display: block;
  width: 28px; height: 1px;
  background: var(--champagne);
}
.eyebrow span {
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--champagne);
}
.page-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2.4rem;
  font-weight: 700;
  color: var(--white);
  line-height: 1.1;
  margin: 0 0 6px;
  letter-spacing: -.02em;
}
.page-title em { font-style: italic; color: var(--champagne); }
.page-subtitle  { font-size: 0.85rem; color: var(--slate2); margin: 0; }

.page-divider {
  height: 1px;
  background: var(--rim2);
  margin: 1.5rem 0 2rem;
  position: relative;
}
.page-divider::after {
  content: '';
  position: absolute;
  left: 50%; top: 0;
  transform: translateX(-50%);
  width: 80px; height: 2px;
  background: var(--champagne);
  border-radius: 2px;
  margin-top: -0.5px;
}

/* ═══════════════════════════════════════════════════════════════
   MESSAGES
═══════════════════════════════════════════════════════════════ */
.msg {
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 0.84rem;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  border: 1px solid;
  animation: riseUp .3s ease;
}
.msg-success { background: var(--green-dim); color: var(--green); border-color: var(--green-border); }
.msg-error   { background: var(--red-dim);   color: var(--red);   border-color: var(--red-border); }

/* ═══════════════════════════════════════════════════════════════
   PANEL BASE
═══════════════════════════════════════════════════════════════ */
.panel {
  background: var(--surface);
  border: 1px solid var(--rim);
  border-radius: 16px;
  overflow: hidden;
  position: relative;
  animation: riseUp .45s ease both;
  margin-bottom: 24px;
}
.panel::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--rim3), transparent);
  pointer-events: none;
  z-index: 1;
}
.panel-head {
  padding: 16px 22px;
  border-bottom: 1px solid var(--rim);
  display: flex;
  align-items: center;
  gap: 12px;
}
.panel-icon {
  width: 30px; height: 30px;
  border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.85rem;
  flex-shrink: 0;
}
.panel-head h2 {
  margin: 0;
  font-family: 'Outfit', sans-serif;
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--white);
}
.panel-body { padding: 24px; }

/* ═══════════════════════════════════════════════════════════════
   FORM
═══════════════════════════════════════════════════════════════ */
.form-group { margin-bottom: 18px; }
.form-group:last-of-type { margin-bottom: 0; }

.form-label {
  display: block;
  font-size: 0.73rem;
  font-weight: 600;
  letter-spacing: .4px;
  text-transform: uppercase;
  color: var(--slate2);
  margin-bottom: 7px;
}
.form-label .opt {
  font-weight: 400;
  color: var(--slate);
  text-transform: none;
  letter-spacing: 0;
  font-size: 0.72rem;
}

.form-control,
.form-select {
  width: 100%;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid var(--rim2);
  background: var(--surface2);
  font-family: 'Outfit', sans-serif;
  font-size: 0.88rem;
  color: var(--white);
  outline: none;
  transition: border-color .2s, box-shadow .2s;
  box-sizing: border-box;
  appearance: none;
  -webkit-appearance: none;
}
.form-control::placeholder { color: var(--slate); }
.form-control:focus,
.form-select:focus {
  border-color: var(--champagne);
  box-shadow: 0 0 0 3px rgba(244,210,31,.10);
}
.form-select option { background: var(--surface2); color: var(--white); }
.form-select option:disabled { color: var(--slate); }

input[type="date"].form-control::-webkit-calendar-picker-indicator {
  filter: invert(0.55);
  cursor: pointer;
}

/* Checkbox toggle */
.check-group {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  background: var(--surface2);
  border: 1px solid var(--rim2);
  border-radius: 10px;
  cursor: pointer;
  transition: border-color .2s;
  margin-bottom: 20px;
}
.check-group:hover { border-color: var(--champagne-bdr); }
.check-group input[type="checkbox"] {
  width: 15px; height: 15px;
  accent-color: var(--champagne);
  cursor: pointer;
  flex-shrink: 0;
}
.check-group-label {
  font-size: 0.86rem;
  font-weight: 600;
  color: var(--slate2);
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
@media(max-width:560px) { .form-grid { grid-template-columns: 1fr; } }

/* Submit button */
.btn-submit {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 11px 28px;
  border-radius: 10px;
  border: none;
  font-family: 'Outfit', sans-serif;
  font-size: 0.88rem;
  font-weight: 700;
  cursor: pointer;
  background: linear-gradient(135deg, #f4d21f, #d1ad00);
  color: #0a1f44;
  box-shadow: 0 4px 18px rgba(244,210,31,.22);
  transition: all .2s;
  width: 100%;
  justify-content: center;
  margin-top: 4px;
}
.btn-submit:hover {
  box-shadow: 0 6px 26px rgba(244,210,31,.38);
  transform: translateY(-1px);
  filter: brightness(1.08);
}

/* ═══════════════════════════════════════════════════════════════
   TERM CARDS
═══════════════════════════════════════════════════════════════ */
.term-list { list-style: none; padding: 0; margin: 0; }

.term-card {
  background: var(--surface2);
  border: 1px solid var(--rim);
  border-radius: 14px;
  padding: 16px 18px;
  margin-bottom: 14px;
  border-left: 3px solid var(--champagne-bdr);
  transition: border-color .2s, box-shadow .2s;
  position: relative;
  overflow: hidden;
  animation: riseUp .45s ease both;
}
.term-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--rim3), transparent);
}
.term-card:hover {
  border-color: var(--rim3);
  box-shadow: 0 6px 24px rgba(0,0,0,.2);
}
.term-card.is-active {
  border-left-color: var(--green);
  background: linear-gradient(135deg, rgba(74,222,128,.04), var(--surface2));
}

/* Stagger delays for term cards */
.term-card:nth-child(1){ animation-delay:.06s; }
.term-card:nth-child(2){ animation-delay:.10s; }
.term-card:nth-child(3){ animation-delay:.14s; }

.term-name {
  font-family: 'Outfit', sans-serif;
  font-size: 0.97rem;
  font-weight: 700;
  color: var(--white);
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 0.7rem;
  font-weight: 700;
  font-family: 'Outfit', sans-serif;
}
.badge-active { background: var(--green-dim);  border: 1px solid var(--green-border);  color: var(--green); }
.badge-manual { background: var(--amber-dim);  border: 1px solid var(--amber-border);  color: var(--amber); }

.term-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  margin-bottom: 12px;
}
.term-meta-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.8rem;
  color: var(--slate2);
}
.term-meta-item i { font-size: 0.78rem; color: var(--slate); }

/* ═══════════════════════════════════════════════════════════════
   SCHOOL DAYS ROW
═══════════════════════════════════════════════════════════════ */
.school-days-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 10px 12px;
  background: var(--surface3);
  border: 1px solid var(--rim2);
  border-radius: 10px;
}
.sd-label {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--slate);
}
.days-display {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--champagne-lt);
  background: var(--champagne-dim);
  border: 1px solid var(--champagne-bdr);
  padding: 2px 12px;
  border-radius: 8px;
  line-height: 1.3;
}
.days-display.manual-set {
  color: var(--amber);
  background: var(--amber-dim);
  border-color: var(--amber-border);
}

.edit-days-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 0.74rem;
  font-family: 'Outfit', sans-serif;
  font-weight: 600;
  background: transparent;
  border: 1px solid var(--rim2);
  border-radius: 7px;
  padding: 4px 11px;
  cursor: pointer;
  color: var(--slate2);
  transition: all .18s;
}
.edit-term-btn {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.76rem;
  font-weight: 700;
  padding: 5px 12px;
  border-radius: 8px;
  color: #0a1f44;
  background: linear-gradient(135deg, #f4d21f, #d1ad00);
  box-shadow: 0 3px 0 #8a7300;
  text-decoration: none;
  transition: transform .15s, filter .15s;
}
.edit-term-btn:hover { transform: translateY(-1px); filter: brightness(1.08); color: #0a1f44; }
.btn-ghost {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 11px 20px;
  border-radius: 10px;
  border: 1px solid var(--rim2);
  color: var(--slate2);
  font-size: 0.88rem;
  font-weight: 600;
  text-decoration: none;
}
.btn-ghost:hover { color: var(--white); border-color: var(--rim3); }
.form-hint { font-size: 0.74rem; color: var(--slate); margin-top: 6px; }
.edit-days-btn:hover {
  background: var(--rim);
  border-color: var(--rim3);
  color: var(--white);
}

/* Days editor */
.days-editor {
  display: none;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 10px;
  padding: 12px 14px;
  background: var(--surface3);
  border: 1px solid var(--rim2);
  border-radius: 10px;
}

.days-editor-input {
  width: 90px;
  padding: 7px 10px;
  border-radius: 8px;
  border: 1px solid var(--rim2);
  background: var(--surface2);
  font-family: 'Outfit', sans-serif;
  font-size: 0.86rem;
  color: var(--white);
  outline: none;
  transition: border-color .2s;
}
.days-editor-input:focus {
  border-color: var(--champagne);
  box-shadow: 0 0 0 3px rgba(244,210,31,.10);
}

.days-save-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--green-dim);
  color: var(--green);
  border: 1px solid var(--green-border);
  padding: 6px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-family: 'Outfit', sans-serif;
  font-size: 0.78rem;
  font-weight: 700;
  transition: background .2s;
}
.days-save-btn:hover { background: rgba(74,222,128,.18); }

.days-reset-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--red-dim);
  color: var(--red);
  border: 1px solid var(--red-border);
  padding: 6px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-family: 'Outfit', sans-serif;
  font-size: 0.78rem;
  font-weight: 700;
  transition: background .2s;
}
.days-reset-btn:hover { background: rgba(248,113,113,.18); }

.days-status {
  font-size: 0.76rem;
  font-weight: 700;
  font-family: 'Outfit', sans-serif;
}
.days-hint {
  width: 100%;
  font-size: 0.72rem;
  color: var(--slate);
  margin-top: 2px;
}

/* ═══════════════════════════════════════════════════════════════
   EMPTY STATE
═══════════════════════════════════════════════════════════════ */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
  text-align: center;
}
.empty-icon {
  width: 52px; height: 52px;
  border-radius: 14px;
  background: var(--surface3);
  border: 1px solid var(--rim2);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.3rem;
  color: var(--slate);
  margin-bottom: 14px;
}
.empty-state h4 { font-size: 0.92rem; font-weight: 600; color: var(--slate2); margin: 0 0 4px; }
.empty-state p  { font-size: 0.8rem;  color: var(--slate); margin: 0; }
</style>
