<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ page_title }} — {{ request.tenant.name }}</title>
<style>
  :root{--ink:#0f2449;--soft:#5b6170;--line:#e4e2dc;--gold:#8a6d00;--bg:#faf8f4;--card:#fff;--red:#b42318;--green:#067647}
  *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6}
  a{color:var(--gold)}.top{padding:14px 20px;border-bottom:1px solid var(--line);background:#fff;display:flex;justify-content:space-between;align-items:center;gap:1rem}
  .top b{font-size:1.05rem}.wrap{max-width:820px;margin:0 auto;padding:28px 16px 60px}h1{font-size:1.9rem;margin:.2rem 0 .4rem;line-height:1.2}
  .sub{color:var(--soft);margin:0 0 1.4rem}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
  label{display:block;font-size:.85rem;font-weight:600;margin:.8rem 0 .25rem}input,select,textarea{width:100%;padding:.65rem .75rem;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:640px){.row{grid-template-columns:1fr}}
  .btn{display:inline-block;background:var(--ink);color:#fff;border:0;border-radius:12px;padding:.75rem 1.2rem;font-weight:700;font-size:1rem;cursor:pointer;text-decoration:none;margin-top:1rem}
  .msg{border-radius:12px;padding:.7rem 1rem;margin-bottom:1rem;border:1px solid var(--line);background:#fff}.msg.error{border-color:#fecdca;color:var(--red);background:#fef3f2}
  .hint{color:var(--soft);font-size:.88rem}table{width:100%;border-collapse:collapse}td,th{padding:.5rem .3rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:.93rem}
  .art h3{margin:1.4rem 0 .3rem}.hp{position:absolute;left:-5000px}
</style></head>
<body><div class="top"><b>{{ request.tenant.name }}</b><nav><a href="/privacy/">Privacy notice</a> &nbsp; <a href="/privacy/request/">Make a request</a></nav></div>
