<div><label>Name</label><input name="name" required maxlength="120" value="{{ g.name|default:'' }}" placeholder="SS3 WAEC Maths coaching"></div>
<div class="row2"><div><label>Subject <span class="hint">(optional)</span></label><select name="subject"><option value="">—</option>{% for s in subjects %}<option value="{{ s.id }}" {% if g.subject_id == s.id %}selected{% endif %}>{{ s.name }}</option>{% endfor %}</select></div>
  <div><label>Teacher</label><select name="teacher"><option value="">—</option>{% for t in teachers %}<option value="{{ t.id }}" {% if g.teacher_id == t.id %}selected{% endif %}>{{ t.full_name }}</option>{% endfor %}</select></div></div>
<div class="row2"><div><label>Day</label><select name="day" required>{% for v, l in days %}<option value="{{ v }}" {% if g.day == v %}selected{% endif %}>{{ l }}</option>{% endfor %}</select></div>
  <div><label>Room <span class="hint">(optional)</span></label><select name="room"><option value="">—</option>{% for r in rooms %}<option value="{{ r.id }}" {% if g.room_id == r.id %}selected{% endif %}>{{ r.name }}</option>{% endfor %}</select></div></div>
<div class="row2"><div><label>From</label><input type="time" name="start" required value="{{ g.start_time|time:'H:i'|default:'14:30' }}"></div><div><label>To</label><input type="time" name="end" required value="{{ g.end_time|time:'H:i'|default:'16:00' }}"></div></div>
<div class="row2"><div><label>Fee per child for the term (₦)</label><input name="fee" inputmode="decimal" value="{{ g.fee|default:'0' }}"></div><div><label>Places <span class="hint">(blank = no limit)</span></label><input type="number" name="capacity" min="1" value="{{ g.capacity|default:'' }}"></div></div>
<div><label>Teacher's pay per session (₦) <span class="hint">added to their salary each month; 0 = none</span></label><input name="teacher_pay" inputmode="decimal" value="{{ g.teacher_pay|default:'0' }}"></div>
<div><label>Term</label><select name="term">{% for t in terms %}<option value="{{ t.id }}" {% if g.term_id == t.id %}selected{% endif %}>{{ t }}</option>{% endfor %}</select></div>
<div><label>Who can join <span class="hint">(none ticked = any class)</span></label><div class="pick">{% for c in all_classes %}<label><input type="checkbox" name="classes" value="{{ c.id }}" {% if c.id in class_ids %}checked{% endif %}> {{ c.name }}</label>{% endfor %}</div></div>
<label style="display:flex;gap:.5rem;align-items:center"><input type="checkbox" name="open_to_parents" value="1" style="width:auto" {% if not g or g.open_to_parents %}checked{% endif %}> Parents can sign up from the parent portal</label>
