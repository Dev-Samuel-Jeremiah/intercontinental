# Nginx site for the school portal.
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/intercontinental
#          sudo ln -s /etc/nginx/sites-available/intercontinental /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Then run certbot (deploy/DEPLOY.md, step 8) — it adds the certificate lines and
# the http → https redirect to this file for you.

upstream intercontinental_app {
    server unix:/run/intercontinental/gunicorn.sock fail_timeout=0;
}

# www → the bare domain, so there is one address for the portal
server {
    listen 80;
    listen [::]:80;
    server_name www.intercontinentalschools.com.ng;
    return 301 https://intercontinentalschools.com.ng$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name intercontinentalschools.com.ng;

    # Passports, documents and bulk-upload spreadsheets
    client_max_body_size 20M;

    access_log /var/log/nginx/intercontinental.access.log;
    error_log  /var/log/nginx/intercontinental.error.log;

    # CSS, JS, images and fonts (python manage.py collectstatic)
    location /static/ {
        alias /srv/intercontinental/static/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Public uploads (school logo, branding)
    location /media/ {
        alias /srv/intercontinental/media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
    }

    # Private files: only reachable when Django has checked permission and
    # answers with X-Accel-Redirect (SIGNED_MEDIA_ACCEL=/protected-media/)
    location /protected-media/ {
        internal;
        alias /srv/intercontinental/private_media/signed/;
    }

    location / {
        proxy_pass http://intercontinental_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}
