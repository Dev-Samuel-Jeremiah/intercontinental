{# Notification bell — included in the top bar. Polls notifications:feed for new notices. #}
<style>
  .nb{position:relative;display:inline-flex}
  .nb-btn{position:relative;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer;
    background:var(--surface2,#0f244b);border:1px solid var(--rim2,rgba(255,255,255,.1));color:var(--slate2,#c9d3e6);
    font-size:1.05rem;transition:color .18s,border-color .18s,background .18s}
  .nb-btn:hover,.nb.open .nb-btn{color:var(--champagne,#f4d21f);border-color:var(--champagne-border,rgba(244,210,31,.3))}
  .nb-btn.ring i{animation:nb-ring 1s ease}
  @keyframes nb-ring{0%,100%{transform:rotate(0)}15%{transform:rotate(16deg)}30%{transform:rotate(-14deg)}45%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}75%{transform:rotate(3deg)}}
  .nb-count{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;display:none;
    align-items:center;justify-content:center;font-size:.66rem;font-weight:700;line-height:1;color:#0a1f44;
    background:var(--champagne,#f4d21f);box-shadow:0 0 0 2px var(--ink2,#0b1e42)}
  .nb-count.on{display:inline-flex}
  .nb-panel{position:absolute;right:0;top:calc(100% + 10px);width:390px;max-width:calc(100vw - 24px);z-index:2000;display:none;
    border-radius:16px;overflow:hidden;background:var(--surface2,#132a54);border:1px solid var(--rim2,rgba(255,255,255,.1));
    box-shadow:0 24px 60px -12px rgba(0,0,0,.6);font-family:var(--sans,inherit)}
  .nb.open .nb-panel{display:block;animation:nb-in .18s ease}
  @keyframes nb-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .nb-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.9rem 1rem .6rem}
  .nb-head b{font-size:.95rem;color:var(--white,#f2f5fb)}
  .nb-head b small{margin-left:.4rem;font-size:.72rem;font-weight:600;color:var(--champagne,#f4d21f)}
  .nb-link{background:none;border:0;padding:0;font:inherit;font-size:.76rem;font-weight:600;color:var(--champagne,#f4d21f);cursor:pointer}
  .nb-link:hover{text-decoration:underline}
  .nb-link[disabled]{opacity:.4;cursor:default;text-decoration:none}
  .nb-tabs{display:flex;gap:.3rem;padding:0 1rem .6rem;border-bottom:1px solid var(--rim,rgba(255,255,255,.06))}
  .nb-tabs button{border:0;background:transparent;font:inherit;font-size:.74rem;font-weight:600;padding:.3rem .7rem;border-radius:99px;
    color:var(--slate2,#c9d3e6);cursor:pointer}
  .nb-tabs button.on{background:var(--champagne-dim,rgba(244,210,31,.12));color:var(--champagne,#f4d21f)}
  .nb-list{max-height:min(430px,60vh);overflow-y:auto;overscroll-behavior:contain}
  .nb-item{display:flex;gap:.75rem;padding:.8rem 1rem;text-decoration:none;color:inherit;border-bottom:1px solid var(--rim,rgba(255,255,255,.06));
    position:relative;transition:background .15s}
  .nb-item:hover{background:rgba(255,255,255,.035)}
  .nb-item.unread{background:rgba(244,210,31,.045)}
  .nb-item.unread::after{content:"";position:absolute;right:1rem;top:1.05rem;width:8px;height:8px;border-radius:50%;background:var(--champagne,#f4d21f)}
  .nb-ic{width:36px;height:36px;flex-shrink:0;border-radius:10px;display:grid;place-items:center;font-size:.95rem;
    background:var(--blue-dim,rgba(96,168,232,.12));color:var(--blue,#60a8e8)}
  .nb-ic.success{background:var(--green-dim,rgba(94,203,142,.12));color:var(--green,#5ecb8e)}
  .nb-ic.warning{background:var(--amber-dim,rgba(245,158,11,.12));color:var(--amber,#f59e0b)}
  .nb-ic.danger{background:var(--red-dim,rgba(232,112,112,.11));color:var(--red,#e87070)}
  .nb-tx{min-width:0;flex:1;padding-right:.9rem}
  .nb-t{font-size:.83rem;font-weight:600;color:var(--white,#f2f5fb);line-height:1.35}
  .nb-b{font-size:.76rem;color:var(--slate2,#c9d3e6);line-height:1.4;margin-top:.15rem;display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical;overflow:hidden}
  .nb-m{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.3rem;font-size:.68rem;color:var(--slate,#8fa0bf)}
  .nb-m .for{color:var(--champagne-lt,#ffe066)}
  .nb-empty{padding:2.4rem 1rem;text-align:center;color:var(--slate,#8fa0bf);font-size:.84rem}
  .nb-empty i{display:block;font-size:1.8rem;margin-bottom:.5rem;opacity:.6}
  .nb-foot{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.7rem 1rem}
  .nb-foot a{font-size:.78rem;font-weight:600;color:var(--champagne,#f4d21f);text-decoration:none}
  .nb-foot a:hover{text-decoration:underline}
  @media(max-width:560px){.nb-panel{position:fixed;left:12px;right:12px;top:70px;width:auto}}
</style>

<div class="nb" id="nb" data-feed="{% url 'notifications:feed' %}" data-read="{% url 'notifications:read' %}"
     data-csrf="{{ csrf_token }}">
  <button type="button" class="nb-btn" id="nb-btn" aria-haspopup="true" aria-expanded="false" aria-label="Notifications">
    <i class="bi bi-bell-fill"></i>
    <span class="nb-count" id="nb-count" aria-live="polite"></span>
  </button>
  <div class="nb-panel" id="nb-panel" role="dialog" aria-label="Notifications">
    <div class="nb-head">
      <b>Notifications<small id="nb-head-count"></small></b>
      <button type="button" class="nb-link" id="nb-all-read">Mark all as read</button>
    </div>
    <div class="nb-tabs">
      <button type="button" class="on" data-tab="all">All</button>
      <button type="button" data-tab="unread">Unread</button>
    </div>
    <div class="nb-list" id="nb-list"><div class="nb-empty"><i class="bi bi-hourglass-split"></i>Loading…</div></div>
    <div class="nb-foot">
      <a href="{% url 'notifications:all' %}">View all notifications</a>
      <button type="button" class="nb-link" id="nb-desktop" hidden>Enable desktop alerts</button>
    </div>
  </div>
</div>

<script>
(function () {
  const root = document.getElementById('nb');
  if (!root || root.dataset.ready) return;
  root.dataset.ready = '1';
  const btn = document.getElementById('nb-btn'), list = document.getElementById('nb-list');
  const countEl = document.getElementById('nb-count'), headCount = document.getElementById('nb-head-count');
  const allRead = document.getElementById('nb-all-read'), desktopBtn = document.getElementById('nb-desktop');
  const POLL_VISIBLE = 20000, POLL_HIDDEN = 60000;
  const baseTitle = document.title.replace(/^\(\d+\+?\)\s*/, '');
  let items = [], latest = 0, unread = 0, tab = 'all', loaded = false, timer = null, stopped = false;
  const sync = 'BroadcastChannel' in window ? new BroadcastChannel('school-notifications') : null;

  function ago(iso) {
    const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + ' min ago';
    if (s < 86400) return Math.floor(s / 3600) + ' h ago';
    if (s < 172800) return 'yesterday';
    return new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
  }

  function setUnread(n) {
    unread = Math.max(0, n);
    const label = unread > 99 ? '99+' : String(unread);
    countEl.textContent = unread ? label : '';
    countEl.classList.toggle('on', unread > 0);
    headCount.textContent = unread ? label + ' new' : '';
    allRead.disabled = unread === 0;
    btn.setAttribute('aria-label', unread ? `Notifications, ${unread} unread` : 'Notifications');
    document.title = (unread ? `(${label}) ` : '') + baseTitle;
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text) e.textContent = text;
    return e;
  }

  function render() {
    const shown = tab === 'unread' ? items.filter(n => n.unread) : items;
    list.replaceChildren();
    if (!shown.length) {
      const empty = el('div', 'nb-empty');
      empty.append(el('i', 'bi ' + (tab === 'unread' ? 'bi-check2-all' : 'bi-bell-slash')),
                   tab === 'unread' ? "You're all caught up." : 'No notifications yet.');
      list.append(empty);
      return;
    }
    shown.forEach(n => {
      const a = el(n.url ? 'a' : 'div', 'nb-item' + (n.unread ? ' unread' : ''));
      if (n.url) a.href = n.url;
      a.dataset.id = n.id;
      const ic = el('div', 'nb-ic ' + n.level);
      ic.append(el('i', 'bi bi-' + n.icon));
      const tx = el('div', 'nb-tx');
      tx.append(el('div', 'nb-t', n.title));
      if (n.body) tx.append(el('div', 'nb-b', n.body));
      const meta = el('div', 'nb-m');
      meta.append(el('span', '', ago(n.at)), el('span', '', '· ' + n.category));
      if (n.for) meta.append(el('span', 'for', '· ' + n.for));
      tx.append(meta);
      a.append(ic, tx);
      a.addEventListener('click', () => markLocal([n.id]));
      list.append(a);
    });
  }

  function markLocal(ids, all) {
    let changed = 0;
    items.forEach(n => { if (n.unread && (all || ids.includes(n.id))) { n.unread = false; changed++; } });
    setUnread(all ? 0 : unread - changed);
    render();
  }

  function desktopAlert(fresh) {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    fresh.filter(n => n.unread).slice(0, 3).forEach(n => {
      try {
        const d = new Notification(n.title, { body: n.body, tag: 'school-' + n.id });
        d.onclick = () => { window.focus(); if (n.url) location.href = n.url; d.close(); };
      } catch (e) { /* some browsers only allow this from a service worker */ }
    });
  }

  async function poll() {
    if (stopped) return;
    try {
      const res = await fetch(root.dataset.feed + (loaded ? '?after=' + latest : ''),
                              { headers: { 'Accept': 'application/json' }, credentials: 'same-origin' });
      if (res.status === 401 || res.status === 403) { stopped = true; return; }
      if (res.ok) {
        const data = await res.json();
        if (!loaded) {
          items = data.items;
        } else if (data.items.length) {
          const known = new Set(items.map(n => n.id));
          const fresh = data.items.filter(n => !known.has(n.id));
          items = fresh.concat(items).slice(0, 40);
          if (fresh.some(n => n.unread)) {
            btn.classList.remove('ring'); void btn.offsetWidth; btn.classList.add('ring');
            desktopAlert(fresh);
          }
        }
        latest = Math.max(latest, data.latest || 0);
        loaded = true;
        setUnread(data.unread);
        render();
      }
    } catch (e) { /* offline: try again on the next tick */ }
    schedule();
  }

  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(poll, document.visibilityState === 'visible' ? POLL_VISIBLE : POLL_HIDDEN);
  }

  async function post(body) {
    const res = await fetch(root.dataset.read, {
      method: 'POST', credentials: 'same-origin', body,
      headers: { 'X-CSRFToken': root.dataset.csrf, 'Content-Type': 'application/x-www-form-urlencoded' },
    });
    return res.ok ? res.json() : null;
  }

  function toggle(open) {
    const isOpen = open ?? !root.classList.contains('open');
    root.classList.toggle('open', isOpen);
    btn.setAttribute('aria-expanded', isOpen);
    if (isOpen) list.scrollTop = 0;
  }

  btn.addEventListener('click', e => { e.stopPropagation(); toggle(); });
  document.addEventListener('click', e => { if (!root.contains(e.target)) toggle(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') toggle(false); });
  root.querySelectorAll('.nb-tabs button').forEach(b => b.addEventListener('click', () => {
    root.querySelectorAll('.nb-tabs button').forEach(x => x.classList.toggle('on', x === b));
    tab = b.dataset.tab;
    render();
  }));
  allRead.addEventListener('click', async () => {
    markLocal([], true);
    if (sync) sync.postMessage({ allRead: true });
    const data = await post('all=1');
    if (data) setUnread(data.unread);
  });
  list.addEventListener('click', e => {
    const a = e.target.closest('.nb-item');
    if (a && sync) sync.postMessage({ read: [Number(a.dataset.id)] });
  });
  if (sync) sync.onmessage = ({ data }) => {
    if (data.allRead) markLocal([], true);
    else if (data.read) markLocal(data.read);
  };

  if ('Notification' in window && Notification.permission === 'default') {
    desktopBtn.hidden = false;
    desktopBtn.addEventListener('click', async () => {
      const p = await Notification.requestPermission();
      desktopBtn.hidden = p !== 'default';
    });
  }

  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') poll(); });
  poll();
})();
</script>
